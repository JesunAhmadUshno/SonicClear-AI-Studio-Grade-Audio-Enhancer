name: Tests

# Runs the DSP unit tests (numpy + scipy only; no FFmpeg needed).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.4.5 scipy==1.17.1
      - run: python -m unittest discover -s tests -v
